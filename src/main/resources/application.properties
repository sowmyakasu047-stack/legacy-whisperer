spring.application.name=legacy-whisperer

# The API reads source files from disk, so listen on this machine only.
server.address=127.0.0.1

# Requests may only analyze folders inside this directory.
whisperer.workspace=.

# AI summaries are optional. Without a key the tool uses offline heuristics.
whisperer.ai.api-key=${ANTHROPIC_API_KEY:}
whisperer.ai.model=${WHISPERER_MODEL:claude-sonnet-5-5}
